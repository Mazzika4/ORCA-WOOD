<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORCA - جدول متابعة العملاء</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1f1b16;--mut:#6b645b;--bd:#e3ded5;--ac:#b4532a;--ok:#1f7a45;--okb:#dff3e6;--no:#a3341f;--nob:#fbe4de;--hd:#efe9de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--tx:#f0ebe3;--mut:#a69e92;--bd:#38332d;--ac:#e0794d;--ok:#6fd39a;--okb:#1c3a2a;--no:#ff9d87;--nob:#412019;--hd:#2a2622}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--tx:#f0ebe3;--mut:#a69e92;--bd:#38332d;--ac:#e0794d;--ok:#6fd39a;--okb:#1c3a2a;--no:#ff9d87;--nob:#412019;--hd:#2a2622}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px}
.wrap{max-width:1300px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:14px;margin:16px 0 8px;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:200px}.tools select{width:auto}
.scroll{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1950px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:top}
th{background:var(--hd);font-size:12px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}
td.ph{direction:ltr;text-align:right}
.st{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:12px}
.st .d{color:var(--mut)}.st .m{font-weight:600}
.b{border-radius:99px;padding:3px 12px;font-size:12px;border:0;font-weight:600}
.b.y{background:var(--okb);color:var(--ok)}.b.n{background:var(--nob);color:var(--no)}
.act button{padding:4px 10px;font-size:12px;margin-inline-start:4px}
.empty{padding:26px;text-align:center;color:var(--mut)}
.cnt{color:var(--mut);font-size:12px;margin:8px 2px 0}
textarea{min-height:64px;resize:vertical}
a{color:var(--ac)}
.lnk{border:0;background:none;color:var(--ac);padding:0;text-decoration:underline;cursor:pointer}
td.nt{white-space:normal;min-width:200px;max-width:260px}
.brand{background:#211e1b;border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:center}
.brand img{height:90px;max-width:100%;object-fit:contain}
</style>
<base target="_blank">
</head>
<body>
<div class="wrap">
<div class="brand"><img alt="ORCA" src="https://k.top4top.io/p_3919kz1mt1.png" style="height:90px;max-width:100%;object-fit:contain;"></div>

<h1>جدول متابعة العملاء</h1>
<p class="sub">التصميم · التعاقد · التصنيع · التوريد · التركيب · الدفعات</p>

<div class="card">
<h2 style="margin-top:0">بيانات العميل والتعاقد</h2>
<div class="form">
<label>العميل<input id="client" placeholder="اسم العميل"></label>
<label>التصميم<input id="design" placeholder="مثال: مطبخ L - نسخة 2"></label>
<label>عنوان العميل<input id="visit" type="text" placeholder="عنوان العميل"></label>
<label>نوع التعاقد<select id="type"><option>مطبخ</option><option>أثاث</option><option>أثاث ومطبخ</option><option>دريسنج / غرفة نوم</option></select></label>
<label>رقم التليفون<input id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"></label>
<label>تاريخ التعاقد<input id="cdate" type="date"></label>
<label>تاريخ التسليم<input id="ddate" type="date"></label>
<label>أمر تصنيع<select id="mfg"><option value="0">لم يتم</option><option value="1">تم</option></select></label>
<label>المشتريات<select id="pur"><option value="0">لم تتم</option><option value="1">تمت</option></select></label>
<label>المهندس المسؤول<input id="eng" placeholder="اسم المهندس"></label>
</div>
<h2>المراحل</h2>
<div class="form">
<label>تاريخ التصنيع<input id="mdate" type="date"></label>
<label>التصنيع<select id="ms"><option value="0">لم يتم</option><option value="1">تم</option></select></label>
<label>تاريخ التوريد<input id="sdate" type="date"></label>
<label>التوريد<select id="ss"><option value="0">لم يتم</option><option value="1">تم</option></select></label>
<label>تاريخ التركيب<input id="idate" type="date"></label>
<label>التركيب<select id="is"><option value="0">لم يتم</option><option value="1">تم</option></select></label>
</div>
<h2>الدفعات</h2>
<div class="form">
<label>تاريخ الدفعة التانية<input id="p2date" type="date"></label>
<label>الدفعة التانية<select id="p2s"><option value="0">لم تتم</option><option value="1">تمت</option></select></label>
<label>قيمة الدفعة ��لتانية<input id="p2amt" type="number" inputmode="decimal" min="0" placeholder="0"></label>
<label>تاريخ الدفعة الأخيرة<input id="p3date" type="date"></label>
<label>الدفعة الأخيرة<select id="p3s"><option value="0">لم تتم</option><option value="1">تمت</option></select></label>
<label>قيمة الدفعة الأخيرة<input id="p3amt" type="number" inputmode="decimal" min="0" placeholder="0"></label>
</div>
<h2>ملف أمر التصنيع والملاحظات</h2>
<div class="form">
<label>ملف أمر التصنيع (PDF أو صورة)<input id="mfile" type="file" accept="application/pdf,image/*"></label>
<label style="grid-column:1/-1">ملاحظات<textarea id="notes" placeholder="أي ملاحظات على العميل أو التنفيذ…"></textarea></label>
</div>
<div class="bar"><button class="p" id="save">إضافة عميل</button><button id="cancel" hidden>إلغاء التعديل</button></div>
</div>

<div class="tools">
<input id="q" placeholder="ابحث بالاسم أو التليفون أو المهندس…">
<select id="f"><option value="">كل الحالات</option><option value="1">تم أمر التصنيع</option><option value="0">لم يتم أمر التصنيع</option></select>
<button id="th">🌓</button>
</div>

<div class="scroll"><table>
<thead><tr><th>#</th><th>العميل</th><th>عنوان العميل</th><th>التصميم</th><th>نوع التعاقد</th><th>التليفون</th><th>تاريخ التعاقد</th><th>تاريخ التسليم</th><th>أمر التصنيع</th><th>المشتريات</th><th>المراحل</th><th>الدفعات</th><th>ملف العميل</th><th>الإجراءات</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<div class="cnt" id="cnt"></div>
</div>

<script>
var KEY="clients_table_v1";
var seed=[];
var rows=load(),editId=null,delId=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}}
var F=["design","visit","client","type","phone","cdate","ddate","mfg","pur","eng","notes","mdate","ms","sdate","ss","idate","is","p2date","p2s","p2amt","p3date","p3s","p3amt"];
var ST=["mfg","pur","ms","ss","is","p2s","p3s"];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>\"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n).toLocaleString("ar-EG")+" ج.م"}
function badge(r,k,yes,no){var on=r[k]==="1";return "<button class='b "+(on?"y":"n")+"' data-a='t' data-k='"+k+"' data-i='"+r.id+"'>"+(on?yes:no)+"</button>"}
function stage(r,dk,sk){return "<td><div class='st'><span class='d'>"+(esc(r[dk])||"—")+"</span>"+badge(r,sk,"تم","لم يتم")+"</div></td>"}
function pay(r,dk,sk,ak){return "<td><div class='st'><span class='d'>"+(esc(r[dk])||"—")+"</span>"+(r[ak]?"<span class='m'>"+fmt(r[ak])+"</span>":"")+badge(r,sk,"تمت","لم تتم")+"</div></td>"}
var AS=null;
try{if(window.claude&&claude.use)claude.use("assets").then(function(a){AS=a}).catch(function(){})}catch(e){}
function idb(){return new Promise(function(res,rej){var q=indexedDB.open("clients_files",1);q.onupgradeneeded=function(){q.result.createObjectStore("f")};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)};})}
function idbPut(k,b){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("f","readwrite");t.objectStore("f").put(b,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction("f").objectStore("f").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function storeFile(f){var fb=function(){var k="f"+Date.now();return idbPut(k,f).then(function(){return "i:"+k})};
if(AS)return AS.upload(f).then(function(r){return "a:"+r.id}).catch(fb);return fb()}
function fcell(r){if(!r.mfid)return "<td>—</td>";var n=esc(r.mfname||"ملف");
if(r.mfid.charAt(0)==="a")return "<td><a href='/_blob/"+esc(r.mfid.slice(2))+"' target='_blank' rel='noopener'>📎 "+n+"</a></td>";
return "<td><button class='lnk' data-a='f' data-i='"+r.id+"'>📎 "+n+"</button></td>"}
function render(){
var q=$("q").value.trim().toLowerCase(),f=$("f").value;
var list=rows.filter(function(r){
if(f&&(r.mfg||"0")!==f)return false;
return !q||[r.client,r.phone,r.eng,r.design,r.notes].join(" ").toLowerCase().indexOf(q)>-1});
$("tb").innerHTML=list.length?list.map(function(r,i){
return "<tr><td>"+(i+1)+"</td><td><b>"+esc(r.client)+"</b></td><td>"+esc(r.visit)+"</td><td>"+esc(r.design)+"</td><td>"+esc(r.type)+"</td><td class='ph'>"+esc(r.phone)+"</td><td>"+esc(r.cdate)+"</td><td>"+esc(r.ddate)+"</td><td>"+badge(r,"mfg","تم","لم يتم")+"</td><td>"+badge(r,"pur","تمت","لم تتم")+"</td>"+fcell(r)+stage(r,"mdate","ms")+stage(r,"sdate","ss")+stage(r,"idate","is")+pay(r,"p2date","p2s","p2amt")+pay(r,"p3date","p3s","p3amt")+"<td class='act'><button data-a='e' data-i='"+r.id+"'>تعديل</button><button data-a='d' data-i='"+r.id+"'>"+(delId===r.id?"تأكيد الحذف؟":"حذف")+"</button></td></tr>"}).join(""):["<tr><td colspan='14' class='empty'>لا توجد بيانات عملاء</td></tr>"];
var done=rows.filter(function(r){return r.mfg==="1"}).length,got=0,left=0;
rows.forEach(function(r){["p2","p3"].forEach(function(p){var a=Number(r[p+"amt"])||0;if(r[p+"s"]==="1")got+=a;else left+=a})});
$("cnt").textContent="إجمالي العملاء: "+rows.length+" — تم أمر تصنيع: "+done+" — لم يتم: "+(rows.length-done)+" — المحصّل من الدفعات: "+fmt(got)+" — المتبقي من الدفعات: "+fmt(left);
}
function clearForm(){F.forEach(function(k){$(k).value=ST.indexOf(k)>-1?"0":k==="type"?"مطبخ":""});editId=null;$("mfile").value="";$("save").textContent="إضافة عميل";$("cancel").hidden=true;}
$("save").onclick=function(){
var o={};F.forEach(function(k){o[k]=$(k).value.trim()});
if(!o.client){$("client").focus();return}
var fl=$("mfile").files[0];
var go=function(x){
if(editId){rows=rows.map(function(r){return r.id===editId?Object.assign({},r,o,x):r})}
else{o.id=Date.now();rows.push(Object.assign(o,x))}
save();clearForm();render()};
if(fl){$("save").disabled=true;storeFile(fl).catch(function(){return null}).then(function(id){go(id?{mfid:id,mfname:fl.name}:{});$("save").disabled=false})}
else go({})};
$("cancel").onclick=function(){clearForm()};
$("tb").onclick=function(e){
var b=e.target.closest("button");if(!b)return;
var id=+b.dataset.i,a=b.dataset.a,r=rows.filter(function(x){return x.id===id})[0];
if(a==="t"){var k=b.dataset.k;r[k]=r[k]==="1"?"0":"1";save()}
if(a==="f"){idbGet(r.mfid.slice(2)).then(function(bl){if(!bl)return;var l=document.createElement("a");l.href=URL.createObjectURL(bl);l.target="_blank";l.click()}).catch(function(){})}
if(a==="e"){F.forEach(function(k){$(k).value=r[k]||(ST.indexOf(k)>-1?"0":k==="type"?"مطبخ":"")});editId=id;$("save").textContent="حفظ التعديل";$("cancel").hidden=false;window.scrollTo({top:0,behavior:"smooth"})}
if(a==="d"){if(delId===id){rows=rows.filter(function(x){return x.id!==id});delId=null;save()}else{delId=id;setTimeout(function(){delId=null;render()},3000)}}
render()};
$("q").oninput=render;$("f").onchange=render;
$("th").onclick=function(){var d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
