<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORCA | إدارة العملاء</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#211e1b;--mut:#70685f;--bd:#e2ddd5;--ac:#b4532a;--ok:#197344;--danger:#a3341f;--hd:#efe9de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px 14px 45px}.brand{background:#211e1b;color:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:16px}.brand strong{font-size:27px;letter-spacing:3px}.brand small{display:block;color:#ddd;margin-top:5px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #00000008}h1,h2{margin:0 0 8px}h1{font-size:23px}h2{font-size:16px;color:var(--ac);margin-top:18px}.sub,.mut{color:var(--mut);font-size:13px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px}input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;width:100%}textarea{min-height:75px;resize:vertical}.bar,.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}button.primary{background:var(--ac);border-color:var(--ac);color:#fff}button.danger{color:var(--danger)}.tools{margin:0 0 12px}.tools input{flex:1;min-width:220px}.scroll{overflow:auto;border:1px solid var(--bd);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:11px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{background:var(--hd);color:var(--mut);font-size:12px}tr:last-child td{border:0}.badge{border:0;border-radius:30px;padding:4px 9px;font-size:12px;background:#fbe4de;color:var(--danger)}.badge.yes{background:#dff3e6;color:var(--ok)}.empty{text-align:center;color:var(--mut);padding:28px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:5}.modalbox{background:var(--card);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px}.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.profile div{border:1px solid var(--bd);border-radius:9px;padding:10px}.profile b{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.error{color:var(--danger);font-size:13px;min-height:20px}.user{color:var(--mut);font-size:12px}
@media print{body{background:#fff}.no-print,#app>header,.brand{display:none!important}.wrap{padding:0}.card{border:0;box-shadow:none}.modal{position:static;background:white;padding:0}.modalbox{max-height:none;box-shadow:none;max-width:none}.modalbox .no-print{display:none!important}}
</style>
</head>
<body>
<div id="auth" class="wrap">
 <div class="brand"><strong>ORCA</strong><small>نظام إدارة العملاء</small></div>
 <div class="card" style="max-width:470px;margin:30px auto">
  <h1 id="authTitle">تسجيل الدخول</h1><p class="sub">أنشئ حسابًا أو سجّل دخولك لإدارة ملفات العملاء.</p>
  <div class="form"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label></div>
  <div id="nameBox" class="hidden" style="margin-top:11px"><label>الاسم<input id="name"></label></div>
  <p id="authError" class="error"></p><div class="bar"><button id="authBtn" class="primary">دخول</button><button id="toggleAuth">إنشاء حساب جديد</button></div>
 </div>
</div>
<div id="app" class="wrap hidden">
 <header class="top no-print"><div><h1>لوحة إدارة العملاء</h1><div class="user" id="who"></div></div><button id="logout">تسجيل الخروج</button></header>
 <div class="brand"><strong>ORCA</strong><small>ملفات العملاء والمتابعة</small></div>
 <section class="card no-print"><h2 style="margin-top:0">إضافة عميل جديد</h2>
  <div class="form"><label>اسم العميل*<input id="client"></label><label>رقم الهاتف<input id="phone" type="tel"></label><label>البريد الإلكتروني<input id="cemail" type="email"></label><label>نوع التعاقد<select id="type"><option>مطبخ</option><option>أثاث</option><option>أثاث ومطبخ</option><option>دريسنج / غرفة نوم</option></select></label><label>التصميم<input id="design"></label><label>تاريخ الزيارة<input id="visit" type="date"></label><label>تاريخ التعاقد<input id="cdate" type="date"></label><label>تاريخ التسليم<input id="ddate" type="date"></label><label>المهندس المسؤول<input id="eng"></label><label>حالة أمر التصنيع<select id="mfg"><option value="0">لم يتم</option><option value="1">تم</option></select></label><label>قيمة التعاقد<input id="total" type="number" min="0"></label><label>المبلغ المدفوع<input id="paid" type="number" min="0"></label></label></div>
  <label style="margin-top:11px">ملاحظات<textarea id="notes"></textarea></label><div class="bar"><button id="saveClient" class="primary">حفظ بيانات العميل</button><button id="cancelEdit" class="hidden">إلغاء التعديل</button></div>
 </section>
 <section class="no-print"><div class="tools"><input id="search" placeholder="ابحث باسم العميل أو الهاتف أو المهندس"><select id="filter"><option value="">كل العملاء</option><option value="1">تم التصنيع</option><option value="0">لم يتم التصنيع</option></select></div><div class="scroll"><table><thead><tr><th>#</th><th>العميل</th><th>الهاتف</th><th>نوع التعاقد</th><th>التسليم</th><th>التصنيع</th><th>المدفوع</th><th>الإجراءات</th></tr></thead><tbody id="tbody"></tbody></table></div><p id="count" class="mut"></p></section>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="top"><h2 id="modalTitle">ملف العميل</h2><button class="no-print" id="closeModal">×</button></div><div id="profile" class="profile"></div><div class="bar no-print"><button class="primary" id="printProfile">🖨️ طباعة ملف العميل</button><button id="editFromProfile">تعديل</button></div></div></div>
<script>
const $=id=>document.getElementById(id), USERS='orca_users_v2', SESSION='orca_session_v2', DATA='orca_clients_v2';
let signup=false, editing=null, selected=null;
const fields=['client','phone','cemail','type','design','visit','cdate','ddate','eng','mfg','total','paid','notes'];
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
async function hash(s){if(window.crypto&&crypto.subtle){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(s)))}
function user(){return read(SESSION)}
function clients(){let all=read(DATA)||{};return all[user()?.email]||[]}
function saveClients(a){let all=read(DATA)||{};all[user().email]=a;write(DATA,all)}
function authRender(){ $('authTitle').textContent=signup?'إنشاء حساب':'تسجيل الدخول';$('authBtn').textContent=signup?'إنشاء الحساب':'دخول';$('toggleAuth').textContent=signup?'لديك حساب؟ تسجيل الدخول':'إنشاء حساب جديد';$('nameBox').classList.toggle('hidden',!signup);$('authError').textContent=''}
$('toggleAuth').onclick=()=>{signup=!signup;authRender()};
$('authBtn').onclick=async()=>{let email=$('email').value.trim().toLowerCase(),pass=$('password').value,name=$('name').value.trim(),us=read(USERS)||{};$('authError').textContent='';if(!email||!pass|| (signup&&!name)){ $('authError').textContent='من فضلك أكمل كل البيانات';return}let h=await hash(pass);if(signup){if(us[email]){$('authError').textContent='هذا البريد مسجل بالفعل';return}us[email]={name,hash:h};write(USERS,us);write(SESSION,{email,name})}else{if(!us[email]||us[email].hash!==h){$('authError').textContent='البريد أو كلمة المرور غير صحيحة';return}write(SESSION,{email,name:us[email].name})}showApp()};
$('logout').onclick=()=>{localStorage.removeItem(SESSION);$('app').classList.add('hidden');$('auth').classList.remove('hidden')};
function showApp(){let u=user();if(!u)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='مرحبًا '+u.name+' — '+u.email;render()}
function val(id){return $(id).value.trim()}
function clearForm(){fields.forEach(id=>$(id).value=id==='type'?'مطبخ':id==='mfg'?'0':'');editing=null;$('saveClient').textContent='حفظ بيانات العميل';$('cancelEdit').classList.add('hidden')}
$('cancelEdit').onclick=clearForm;
$('saveClient').onclick=()=>{let o={};fields.forEach(id=>o[id]=val(id));if(!o.client){$('client').focus();return}let a=clients();if(editing){o.id=editing;a=a.map(x=>x.id===editing?o:x)}else{o.id=Date.now();o.createdAt=new Date().toISOString();a.unshift(o)}saveClients(a);clearForm();render()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(x){return Number(x||0).toLocaleString('ar-EG')+' ج.م'}
function render(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value,a=clients().filter(x=>(!f||x.mfg===f)&&(!q||[x.client,x.phone,x.eng,x.design,x.cemail].join(' ').toLowerCase().includes(q)));$('tbody').innerHTML=a.length?a.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.client)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.type)}</td><td>${esc(x.ddate)||'—'}</td><td><span class="badge ${x.mfg==='1'?'yes':''}">${x.mfg==='1'?'تم':'لم يتم'}</span></td><td>${money(x.paid)}</td><td><button data-view="${x.id}">عرض الملف</button> <button data-edit="${x.id}">تعديل</button> <button class="danger" data-del="${x.id}">حذف</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">لا توجد بيانات عملاء حتى الآن</td></tr>';$('count').textContent='عدد العملاء: '+a.length+' من '+clients().length}
$('search').oninput=render;$('filter').onchange=render;
$('tbody').onclick=e=>{let b=e.target.closest('button'),a=clients(),id=Number(b?.dataset.view||b?.dataset.edit||b?.dataset.del),x=a.find(v=>v.id===id);if(!x)return;if(b.dataset.del){if(confirm('هل تريد حذف ملف العميل؟')){saveClients(a.filter(v=>v.id!==id));render()}return}if(b.dataset.view){selected=x;openProfile(x)}else{editing=id;fields.forEach(k=>$(k).value=x[k]||'');$('saveClient').textContent='حفظ التعديل';$('cancelEdit').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}};
function openProfile(x){$('modalTitle').textContent='ملف العميل: '+x.client;$('profile').innerHTML=[['اسم العميل',x.client],['الهاتف',x.phone],['البريد',x.cemail],['نوع التعاقد',x.type],['التصميم',x.design],['تاريخ الزيارة',x.visit],['تاريخ التعاقد',x.cdate],['تاريخ التسليم',x.ddate],['المهندس',x.eng],['أمر التصنيع',x.mfg==='1'?'تم':'لم يتم'],['قيمة التعاقد',money(x.total)],['المبلغ المدفوع',money(x.paid)],['المتبقي',money(Math.max(0,Number(x.total||0)-Number(x.paid||0)))],['ملاحظات',x.notes||'—']].map(v=>`<div><b>${esc(v[0])}</b>${esc(v[1])||'—'}</div>`).join('');$('modal').classList.remove('hidden')}
$('closeModal').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.add('hidden')};$('printProfile').onclick=()=>window.print();$('editFromProfile').onclick=()=>{$('modal').classList.add('hidden');let b={dataset:{edit:String(selected.id)}};$('tbody').onclick({target:{closest:()=>b}})};
authRender();if(user())showApp();
</script></body></html>
