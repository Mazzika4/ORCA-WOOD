<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORCA - جدول متابعة العملاء</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1f1b16;--mut:#6b645b;--bd:#e3ded5;--ac:#b4532a;--ok:#dff3e6;--no:#fbe4de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,Tahoma,Arial,sans-serif;font-size:15px}.wrap{max-width:1300px;margin:auto;padding:20px 14px 40px}h1{font-size:22px;margin:0 0 4px}h2{font-size:14px;color:var(--ac);margin:16px 0 8px}.sub{color:var(--mut);font-size:13px;margin:0 0 18px}.card,.scroll{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}textarea{min-height:64px;resize:vertical}.bar,.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}button{font:inherit;cursor:pointer;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);padding:8px 14px}button.p{background:var(--ac);border-color:var(--ac);color:#fff}.tools{margin-bottom:12px}.tools input{flex:1;min-width:200px}.scroll{overflow-x:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:2100px}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap;vertical-align:top}th{background:#efe9de;font-size:12px;color:var(--mut)}tr:last-child td{border:0}.st{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:12px}.st .d{color:var(--mut)}.b{border:0;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600}.b.y{background:var(--ok);color:#1f7a45}.b.n{background:var(--no);color:#a3341f}.nt{white-space:normal;min-width:200px;max-width:280px}.cnt{color:var(--mut);font-size:12px;margin:8px 2px}.empty{text-align:center;padding:25px;color:var(--mut)}
</style></head>
<body><div class="wrap"><h1>جدول متابعة العملاء</h1><p class="sub">التصميم · التعاقد · التصنيع · التوريد · التركيب · الدفعات</p>
<div class="card"><h2 style="margin-top:0">بيانات العميل والتعاقد</h2><div class="form">
<label>التصميم<input id="design" placeholder="مثال: مطبخ L - نسخة 2"></label>
<label>تاريخ زيارة المعرض<input id="visit" type="date"></label>
<label>العميل<input id="client" placeholder="اسم العميل"></label>
<label>عنوان العميل<input id="address" placeholder="اكتب عنوان العميل"></label>
<label>نوع التعاقد<select id="type"><option>مطبخ</option><option>أثاث</option><option>أثاث ومطبخ</option><option>دريسنج / غرفة نوم</option></select></label>
<label>رقم التليفون<input id="phone" type="tel" placeholder="01xxxxxxxxx"></label>
<label>تاريخ التسليم<input id="ddate" type="date"></label>
<label>أمر تصنيع<select id="mfg"><option value="0">لم يتم</option><option value="1">تم</option></select></label>
<label>المشتريات<select id="pur"><option value="0">لم تتم</option><option value="1">تمت</option></select></label>
<label>المهندس المسؤول<input id="eng" placeholder="اسم المهندس"></label></div>
<h2>المراحل</h2><div class="form"><label>تاريخ التصنيع<input id="mdate" type="date"></label><label>التصنيع<select id="ms"><option value="0">لم يتم</option><option value="1">تم</option></select></label><label>تاريخ التوريد<input id="sdate" type="date"></label><label>التوريد<select id="ss"><option value="0">لم يتم</option><option value="1">تم</option></select></label><label>تاريخ التركيب<input id="idate" type="date"></label><label>التركيب<select id="is"><option value="0">لم يتم</option><option value="1">تم</option></select></label></div>
<h2>الدفعات</h2><div class="form"><label>تاريخ الدفعة التانية<input id="p2date" type="date"></label><label>الدفعة التانية<select id="p2s"><option value="0">لم تتم</option><option value="1">تمت</option></select></label><label>قيمة الدفعة التانية<input id="p2amt" type="number" min="0" placeholder="0"></label><label>تاريخ الدفعة الأخيرة<input id="p3date" type="date"></label><label>الدفعة الأخيرة<select id="p3s"><option value="0">لم تتم</option><option value="1">تمت</option></select></label><label>قيمة الدفعة الأخيرة<input id="p3amt" type="number" min="0" placeholder="0"></label></div>
<h2>الملاحظات</h2><textarea id="notes" placeholder="أي ملاحظات على العميل أو التنفيذ…"></textarea><div class="bar"><button class="p" id="save">إضافة عميل</button><button id="cancel" hidden>إلغاء التعديل</button></div></div>
<div class="tools"><input id="q" placeholder="ابحث بالاسم أو العنوان أو التليفون أو المهندس…"><select id="f"><option value="">كل الحالات</option><option value="1">تم أمر التصنيع</option><option value="0">لم يتم أمر التصنيع</option></select></div><div class="scroll"><table><thead><tr><th>#</th><th>التصميم</th><th>زيارة المعرض</th><th>العميل</th><th>عنوان العميل</th><th>نوع التعاقد</th><th>التليفون</th><th>التسليم</th><th>التصنيع</th><th>المشتريات</th><th>مراحل التنفيذ</th><th>المهندس</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody id="tb"></tbody></table></div><div class="cnt" id="cnt"></div></div>
<script>
const KEY='clients_table_v2',fields=['design','visit','client','address','type','phone','ddate','mfg','pur','eng','notes','mdate','ms','sdate','ss','idate','is','p2date','p2s','p2amt','p3date','p3s','p3amt'],status=['mfg','pur','ms','ss','is','p2s','p3s'];let rows=JSON.parse(localStorage.getItem(KEY)||'[]'),editId=null,deleteId=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(rows))}function badge(r,k){let on=r[k]==='1';return `<button class="b ${on?'y':'n'}" data-a="toggle" data-k="${k}" data-i="${r.id}">${on?'تم':'لم يتم'}</button>`}function stage(r,d,s){return `<td><div class="st"><span class="d">${esc(r[d])||'—'}</span>${badge(r,s)}</div></td>`}function render(){let q=$('q').value.trim().toLowerCase(),f=$('f').value,list=rows.filter(r=>(!f||(r.mfg||'0')===f)&&(!q||[r.client,r.address,r.phone,r.eng,r.design,r.notes].join(' ').toLowerCase().includes(q)));$('tb').innerHTML=list.length?list.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.design)}</td><td>${esc(r.visit)}</td><td><b>${esc(r.client)}</b></td><td class="nt">${esc(r.address)}</td><td>${esc(r.type)}</td><td>${esc(r.phone)}</td><td>${esc(r.ddate)}</td><td>${badge(r,'mfg')}</td><td>${badge(r,'pur')}</td>${stage(r,'mdate','ms')}${stage(r,'sdate','ss')}${stage(r,'idate','is')}<td>${esc(r.eng)}</td><td class="nt">${esc(r.notes)}</td><td><button data-a="edit" data-i="${r.id}">تعديل</button> <button data-a="delete" data-i="${r.id}">${deleteId===r.id?'تأكيد الحذف؟':'حذف'}</button></td></tr>`).join(''):'<tr><td colspan="14" class="empty">لا توجد بيانات</td></tr>';$('cnt').textContent=`إجمالي العملاء: ${rows.length}`}function clearForm(){fields.forEach(k=>$(k).value=status.includes(k)?'0':k==='type'?'مطبخ':'');editId=null;$('save').textContent='إضافة عميل';$('cancel').hidden=true}function fill(r){fields.forEach(k=>$(k).value=r[k]??(status.includes(k)?'0':k==='type'?'مطبخ':''));editId=r.id;$('save').textContent='حفظ التعديل';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}
$('save').onclick=()=>{let o=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));if(!o.client)return $('client').focus();if(editId)rows=rows.map(r=>r.id===editId?{...r,...o}:r);else rows.push({id:Date.now(),...o});persist();clearForm();render()};$('cancel').onclick=clearForm;$('q').oninput=render;$('f').onchange=render;$('tb').onclick=e=>{let b=e.target.closest('button');if(!b)return;let id=+b.dataset.i,r=rows.find(x=>x.id===id);if(b.dataset.a==='toggle'){r[b.dataset.k]=r[b.dataset.k]==='1'?'0':'1';persist();render()}if(b.dataset.a==='edit')fill(r);if(b.dataset.a==='delete'){if(deleteId===id){rows=rows.filter(x=>x.id!==id);deleteId=null;persist()}else{deleteId=id;setTimeout(()=>{deleteId=null;render()},3000)}render()}};render();
</script></body></html>
